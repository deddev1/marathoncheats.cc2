# CI Workers Builds project name (repo: marathoncheats)
name = "marathoncheats2"
compatibility_date = "2026-01-01"
main = "src/worker.ts"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"
# HTML/XML go through the Worker for www/http → apex 301s.
# Hashed static files skip the Worker so JS/CSS/images hit the asset CDN directly.
run_worker_first = [
	"/*",
	"!/_astro/*",
	"!/images/*",
	"!/*.woff2",
	"!/*.webp",
	"!/*.avif",
	"!/*.png",
	"!/*.svg",
	"!/*.ico",
	"!/*.css",
]
