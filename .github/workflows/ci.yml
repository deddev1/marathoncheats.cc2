name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: marathoncheats.cc2-main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: marathoncheats.cc2-main/package-lock.json

      - name: Install dependencies
        run: npm ci --prefix marathoncheats.cc2-main

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

      - name: Cloudflare deploy dry run
        run: npx wrangler deploy --dry-run
