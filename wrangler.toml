name = "marathoncheats2"
compatibility_date = "2026-01-01"
main = "marathoncheats.cc2-main/src/worker.ts"

[build]
command = "bash build.sh"

[assets]
directory = "./marathoncheats.cc2-main/dist"
binding = "ASSETS"
not_found_handling = "404-page"
# Run Worker first so www/http → https://marathoncheats.cc 301s always apply
run_worker_first = true
